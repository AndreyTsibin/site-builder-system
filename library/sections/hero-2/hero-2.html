<!--
  Hero-2: Two-Column Hero Section with Image

  Features:
  - Two-column grid layout (text left, image right)
  - Large heading (H1) and subtitle
  - Dual CTA buttons (primary and secondary)
  - Responsive image with alt text placeholder
  - Full ARIA accessibility support
  - BEM methodology
  - Mobile-first responsive design (stacks on mobile)

  Placeholders:
  - {{hero.title}} — Main headline (H1)
  - {{hero.subtitle}} — Supporting text/description
  - {{hero.cta_primary}} — Primary CTA button text
  - {{hero.cta_secondary}} — Secondary CTA button text
  - {{hero.image_url}} — Hero image URL
  - {{hero.image_alt}} — Hero image alt text for accessibility
-->

<section class="hero-2" id="hero" role="region" aria-labelledby="heroTitle">
  <div class="container">
    <div class="hero-2__wrapper">

      <!-- Text Content Column -->
      <div class="hero-2__content">

        <!-- Main Heading -->
        <h1 class="hero-2__title" id="heroTitle">
          {{hero.title}}
        </h1>

        <!-- Subtitle -->
        <p class="hero-2__subtitle">
          {{hero.subtitle}}
        </p>

        <!-- CTA Buttons Group -->
        <div class="hero-2__cta-group">

          <!-- Primary CTA Button -->
          <a
            href="#cta"
            class="hero-2__cta hero-2__cta--primary"
            role="button"
            aria-label="Primary call to action"
          >
            {{hero.cta_primary}}
          </a>

          <!-- Secondary CTA Button -->
          <a
            href="#about"
            class="hero-2__cta hero-2__cta--secondary"
            role="button"
            aria-label="Secondary call to action"
          >
            {{hero.cta_secondary}}
          </a>

        </div>

      </div>

      <!-- Image Column -->
      <div class="hero-2__image-wrapper">
        <img
          src="{{hero.image_url}}"
          alt="{{hero.image_alt}}"
          class="hero-2__image"
          loading="eager"
        />
      </div>

    </div>
  </div>
</section>
