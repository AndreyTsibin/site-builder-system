<!--
  Footer-1: Classic 4-Column Footer with Social Links

  Features:
  - 4-column grid layout (About, Navigation, Contacts, Social)
  - Responsive layout (stack columns on mobile)
  - Remix Icon social media icons
  - Copyright section at bottom
  - Full ARIA accessibility support
  - BEM methodology
  - Mobile-first responsive design

  Placeholders:
  - {{logo.text}} — Logo text
  - {{footer.about}} — Company description text
  - {{nav.item1}}, {{nav.item2}}, {{nav.item3}} — Navigation items
  - {{contacts.phone}} — Phone number (raw format: +7 999 123-45-67)
  - {{contacts.email}} — Email address
  - {{contacts.address}} — Physical address
  - {{social.vk}} — VK profile URL
  - {{social.telegram}} — Telegram channel/bot URL
  - {{social.whatsapp}} — WhatsApp number link
  - {{footer.copyright}} — Copyright text
-->

<footer class="footer" role="contentinfo" aria-labelledby="footerTitle">
  <div class="container">

    <div class="footer__grid">

      <!-- Column 1: About Company -->
      <div class="footer__column footer__column--about">
        <h3 class="footer__title" id="footerTitle">{{logo.text}}</h3>
        <p class="footer__text">
          {{footer.about}}
        </p>
      </div>

      <!-- Column 2: Navigation -->
      <div class="footer__column footer__column--nav">
        <h4 class="footer__heading">Навигация</h4>
        <nav class="footer__nav" role="navigation" aria-label="Footer navigation">
          <ul class="footer__nav-list">
            <li class="footer__nav-item">
              <a href="#services" class="footer__nav-link">{{nav.item1}}</a>
            </li>
            <li class="footer__nav-item">
              <a href="#about" class="footer__nav-link">{{nav.item2}}</a>
            </li>
            <li class="footer__nav-item">
              <a href="#contacts" class="footer__nav-link">{{nav.item3}}</a>
            </li>
          </ul>
        </nav>
      </div>

      <!-- Column 3: Contacts -->
      <div class="footer__column footer__column--contacts">
        <h4 class="footer__heading">Контакты</h4>
        <address class="footer__contacts">
          <div class="footer__contact-item">
            <i class="ri-phone-line footer__contact-icon" aria-hidden="true"></i>
            <a href="tel:{{contacts.phone}}" class="footer__contact-link">{{contacts.phone}}</a>
          </div>
          <div class="footer__contact-item">
            <i class="ri-mail-line footer__contact-icon" aria-hidden="true"></i>
            <a href="mailto:{{contacts.email}}" class="footer__contact-link">{{contacts.email}}</a>
          </div>
          <div class="footer__contact-item">
            <i class="ri-map-pin-line footer__contact-icon" aria-hidden="true"></i>
            <span class="footer__contact-text">{{contacts.address}}</span>
          </div>
        </address>
      </div>

      <!-- Column 4: Social Media -->
      <div class="footer__column footer__column--social">
        <h4 class="footer__heading">Мы в соцсетях</h4>
        <div class="footer__social" role="navigation" aria-label="Social media links">
          <a
            href="{{social.vk}}"
            class="footer__social-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="VKontakte"
          >
            <i class="ri-vk-fill footer__social-icon" aria-hidden="true"></i>
          </a>
          <a
            href="{{social.telegram}}"
            class="footer__social-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Telegram"
          >
            <i class="ri-telegram-fill footer__social-icon" aria-hidden="true"></i>
          </a>
          <a
            href="{{social.whatsapp}}"
            class="footer__social-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="WhatsApp"
          >
            <i class="ri-whatsapp-fill footer__social-icon" aria-hidden="true"></i>
          </a>
        </div>
      </div>

    </div>

    <!-- Copyright Section -->
    <div class="footer__bottom">
      <p class="footer__copyright">
        {{footer.copyright}}
      </p>
    </div>

  </div>
</footer>
