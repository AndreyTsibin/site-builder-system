<!--
  Hero-1: Centered Hero Section with Email Subscription Form

  Features:
  - Centered text layout with large heading
  - Subtitle for additional context
  - Email subscription form with validation
  - Primary CTA button
  - Full ARIA accessibility support
  - BEM methodology
  - Mobile-first responsive design

  Placeholders:
  - {{hero.title}} — Main headline (H1)
  - {{hero.subtitle}} — Supporting text/description
  - {{hero.cta_text}} — Submit button text
-->

<section class="hero" id="hero" role="region" aria-labelledby="heroTitle">
  <div class="container">
    <div class="hero__content">

      <!-- Main Heading -->
      <h1 class="hero__title" id="heroTitle">
        {{hero.title}}
      </h1>

      <!-- Subtitle -->
      <p class="hero__subtitle">
        {{hero.subtitle}}
      </p>

      <!-- Email Subscription Form -->
      <form
        class="hero__form"
        id="heroForm"
        role="form"
        aria-label="Email subscription form"
        novalidate
      >
        <div class="hero__form-wrapper">

          <!-- Email Input -->
          <div class="hero__form-field">
            <label for="heroEmail" class="sr-only">Email address</label>
            <input
              type="email"
              id="heroEmail"
              name="email"
              class="hero__form-input"
              placeholder="your@email.com"
              required
              aria-required="true"
              aria-describedby="heroEmailError"
              aria-invalid="false"
            />
            <span
              id="heroEmailError"
              class="hero__form-error"
              role="alert"
              aria-live="polite"
            ></span>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="hero__form-submit"
            aria-label="Submit subscription form"
          >
            {{hero.cta_text}}
          </button>

        </div>
      </form>

    </div>
  </div>
</section>
