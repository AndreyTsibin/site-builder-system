<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог секций — Site Builder</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Remix Icon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/variables.css">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--background);
      padding: var(--space-8);
    }

    .demo-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .demo-header {
      margin-bottom: var(--space-12);
      padding-bottom: var(--space-8);
      border-bottom: 2px solid var(--border);
    }

    .demo-header h1 {
      font-size: var(--font-size-7);
      font-weight: 700;
      color: var(--primary);
      margin-bottom: var(--space-2);
    }

    .demo-header p {
      font-size: var(--font-size-3);
      color: var(--text-light);
    }

    .demo-section {
      margin-bottom: var(--space-12);
    }

    .demo-section h2 {
      font-size: var(--font-size-6);
      font-weight: 700;
      color: var(--text);
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--border);
    }

    .demo-item {
      margin-bottom: var(--space-10);
      padding: var(--space-6);
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .demo-item h3 {
      font-size: var(--font-size-5);
      font-weight: 600;
      color: var(--primary);
      margin-bottom: var(--space-2);
    }

    .demo-item .demo-id {
      display: inline-block;
      font-family: 'Courier New', monospace;
      font-size: var(--font-size-2);
      color: var(--text-light);
      background: var(--background);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-2);
    }

    .demo-item .demo-description {
      font-size: var(--font-size-3);
      color: var(--text-light);
      margin-bottom: var(--space-4);
    }

    .demo-item .demo-preview {
      margin-bottom: var(--space-4);
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .empty-state {
      text-align: center;
      padding: var(--space-12);
      color: var(--text-light);
    }

    .empty-state i {
      font-size: 64px;
      margin-bottom: var(--space-4);
      color: var(--border);
    }

    .empty-state h3 {
      font-size: var(--font-size-5);
      font-weight: 600;
      color: var(--text);
      margin-bottom: var(--space-2);
    }

    .empty-state p {
      font-size: var(--font-size-3);
    }

    @media (max-width: 768px) {
      body {
        padding: var(--space-4);
      }

      .demo-header h1 {
        font-size: var(--font-size-6);
      }

      .demo-section h2 {
        font-size: var(--font-size-5);
      }
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <!-- Header -->
    <header class="demo-header">
      <h1>🧩 Каталог секций Site Builder</h1>
      <p>Готовые секции, собранные из базовых элементов</p>
    </header>

    <!-- Empty State -->
    <div class="empty-state">
      <i class="ri-inbox-line"></i>
      <h3>Секции скоро появятся</h3>
      <p>Мы создадим header, hero, features, pricing, footer и другие секции.<br>
      Они будут добавлены в этот каталог с ID и примерами использования.</p>
    </div>

    <!-- Секции будут добавлены ниже -->
    <!--
    <section class="demo-section">
      <h2>🏠 Header Sections</h2>

      <div class="demo-item" id="header-1">
        <h3>Header 1 — Simple Navigation</h3>
        <span class="demo-id">ID: header-1</span>
        <p class="demo-description">Простой хедер с логотипом, навигацией и кнопкой CTA</p>
        <div class="demo-preview">
          [Превью секции]
        </div>
      </div>
    </section>
    -->

    <!-- Footer -->
    <footer style="margin-top: var(--space-12); padding-top: var(--space-8); border-top: 2px solid var(--border); text-align: center; color: var(--text-light);">
      <p>Site Builder — элементный подход к созданию лендингов 🚀</p>
    </footer>
  </div>
</body>
</html>
