<!-- Card Pricing — Pricing plan card -->
<article class="card card--pricing">
  <div class="card__header">
    <h3 class="card__plan">Стандарт</h3>
    <div class="card__price">
      <span class="card__price-amount">15 000</span>
      <span class="card__price-currency">₽</span>
      <span class="card__price-period">/месяц</span>
    </div>
  </div>

  <ul class="card__features">
    <li class="card__feature">
      <i class="ri-check-line"></i>
      <span>До 10 пользователей</span>
    </li>
    <li class="card__feature">
      <i class="ri-check-line"></i>
      <span>50 ГБ хранилища</span>
    </li>
    <li class="card__feature">
      <i class="ri-check-line"></i>
      <span>Email поддержка</span>
    </li>
    <li class="card__feature">
      <i class="ri-check-line"></i>
      <span>Базовая аналитика</span>
    </li>
  </ul>

  <button class="btn btn--primary card__cta">Выбрать план</button>
</article>
