<!-- Spinner - Small (for buttons) -->
<div class="spinner spinner--sm" role="status" aria-label="Loading">
  <div class="spinner__circle"></div>
</div>

<!-- Spinner - Medium (default) -->
<div class="spinner" role="status" aria-label="Loading">
  <div class="spinner__circle"></div>
</div>

<!-- Spinner - Large (for pages/dialogs) -->
<div class="spinner spinner--lg" role="status" aria-label="Loading">
  <div class="spinner__circle"></div>
</div>

<!-- Button with Spinner -->
<button class="btn btn--loading" disabled>
  <span class="btn__spinner">
    <div class="spinner spinner--sm">
      <div class="spinner__circle"></div>
    </div>
  </span>
  <span class="btn__text">Saving...</span>
</button>

<!-- Page Loader Overlay -->
<div class="loader-overlay">
  <div class="spinner spinner--lg">
    <div class="spinner__circle"></div>
  </div>
  <p class="loader-overlay__text">Loading...</p>
</div>
