<!-- Radio — Radio button group for single selection -->
<div class="form-radio-group">
  <p class="form-radio-group__title">Выберите способ связи</p>

  <div class="form-radio">
    <input
      type="radio"
      id="contact-phone"
      name="contact"
      value="phone"
      class="form-radio__input"
      checked
    />
    <label for="contact-phone" class="form-radio__label">
      Телефон
    </label>
  </div>

  <div class="form-radio">
    <input
      type="radio"
      id="contact-email"
      name="contact"
      value="email"
      class="form-radio__input"
    />
    <label for="contact-email" class="form-radio__label">
      Email
    </label>
  </div>

  <div class="form-radio">
    <input
      type="radio"
      id="contact-messenger"
      name="contact"
      value="messenger"
      class="form-radio__input"
    />
    <label for="contact-messenger" class="form-radio__label">
      Мессенджер
    </label>
  </div>
</div>
