<!-- Toggle 1 - Standard -->
<div class="toggle-group">
  <div class="toggle-item">
    <input type="checkbox" id="toggle-1" class="toggle__input">
    <label for="toggle-1" class="toggle">
      <span class="toggle__slider"></span>
    </label>
    <label for="toggle-1" class="toggle__label">Option one</label>
  </div>

  <div class="toggle-item">
    <input type="checkbox" id="toggle-2" class="toggle__input" checked>
    <label for="toggle-2" class="toggle">
      <span class="toggle__slider"></span>
    </label>
    <label for="toggle-2" class="toggle__label">Option two</label>
  </div>
</div>
