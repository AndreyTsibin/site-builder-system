<!-- Input 3 - With Clear Icon (Right) -->
<div class="input-with-icon input-with-icon--right">
  <input
    type="text"
    class="input-with-icon__field"
    placeholder="Placeholder"
    aria-label="Input with clear button"
  >
  <button class="input-with-icon__btn" type="button" aria-label="Clear input">
    <i class="ri-close-circle-line"></i>
  </button>
</div>

<!-- Input 4 - With Card Icon (Left) and Clear Icon (Right) -->
<div class="input-with-icon input-with-icon--both">
  <i class="ri-bank-card-line input-with-icon__icon-left"></i>
  <input
    type="text"
    class="input-with-icon__field"
    placeholder="Placeholder"
    aria-label="Input with card icon"
  >
  <button class="input-with-icon__btn" type="button" aria-label="Clear input">
    <i class="ri-close-circle-line"></i>
  </button>
</div>
