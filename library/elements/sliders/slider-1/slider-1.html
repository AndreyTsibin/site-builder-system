<!-- Slider 1 - Single slide with top arrows and bottom-left dots -->
<div class="slider" data-slider="slider-1">
  <div class="slider__container">
    <!-- Navigation arrows (top) -->
    <div class="slider__arrows slider__arrows--top">
      <button class="slider__arrow slider__arrow--prev" data-slider-prev aria-label="Previous slide">
        <i class="ri-arrow-left-s-line" aria-hidden="true"></i>
      </button>
      <button class="slider__arrow slider__arrow--next" data-slider-next aria-label="Next slide">
        <i class="ri-arrow-right-s-line" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Slides -->
    <div class="slider__track">
      <div class="slider__slide slider__slide--active">
        <div class="slider__content">
          <h3 class="heading heading--h3">Slide 1</h3>
          <p class="text text--muted">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        </div>
      </div>

      <div class="slider__slide">
        <div class="slider__content">
          <h3 class="heading heading--h3">Slide 2</h3>
          <p class="text text--muted">Suspendisse varius enim in eros elementum tristique.</p>
        </div>
      </div>

      <div class="slider__slide">
        <div class="slider__content">
          <h3 class="heading heading--h3">Slide 3</h3>
          <p class="text text--muted">Duis cursus, mi quis viverra ornare, eros dolor interdum nulla.</p>
        </div>
      </div>
    </div>

    <!-- Dots indicator (bottom-left) -->
    <div class="slider__dots slider__dots--bottom-left">
      <button class="slider__dot slider__dot--active" data-slider-dot="0" aria-label="Go to slide 1"></button>
      <button class="slider__dot" data-slider-dot="1" aria-label="Go to slide 2"></button>
      <button class="slider__dot" data-slider-dot="2" aria-label="Go to slide 3"></button>
    </div>
  </div>
</div>
