<!-- Slider Carousel - Multiple items with bottom-right controls -->
<!-- Use modifier classes: slider--carousel-auto (auto-width items) or slider--carousel-3 (3 items) -->

<div class="slider slider--carousel-auto slider--controls-bottom" data-slider="slider-carousel">
  <div class="slider__container">
    <!-- Slides -->
    <div class="slider__track slider__track--carousel">
      <div class="slider__slide">
        <div class="slider__content">
          <h3 class="heading heading--h5">Item 1</h3>
          <p class="text text--muted text--sm">Lorem ipsum.</p>
        </div>
      </div>

      <div class="slider__slide">
        <div class="slider__content">
          <h3 class="heading heading--h5">Item 2</h3>
          <p class="text text--muted text--sm">Suspendisse.</p>
        </div>
      </div>

      <div class="slider__slide">
        <div class="slider__content">
          <h3 class="heading heading--h5">Item 3</h3>
          <p class="text text--muted text--sm">Duis cursus.</p>
        </div>
      </div>

      <div class="slider__slide">
        <div class="slider__content">
          <h3 class="heading heading--h5">Item 4</h3>
          <p class="text text--muted text--sm">Eros dolor.</p>
        </div>
      </div>

      <div class="slider__slide">
        <div class="slider__content">
          <h3 class="heading heading--h5">Item 5</h3>
          <p class="text text--muted text--sm">Viverra.</p>
        </div>
      </div>

      <div class="slider__slide">
        <div class="slider__content">
          <h3 class="heading heading--h5">Item 6</h3>
          <p class="text text--muted text--sm">Interdum.</p>
        </div>
      </div>
    </div>

    <!-- Controls (bottom-right): arrows + dots -->
    <div class="slider__controls slider__controls--bottom-right">
      <!-- Dots -->
      <div class="slider__dots"></div>

      <!-- Arrows -->
      <div class="slider__arrows">
        <button class="slider__arrow slider__arrow--prev" data-slider-prev aria-label="Previous slide">
          <i class="ri-arrow-left-s-line" aria-hidden="true"></i>
        </button>
        <button class="slider__arrow slider__arrow--next" data-slider-next aria-label="Next slide">
          <i class="ri-arrow-right-s-line" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</div>
