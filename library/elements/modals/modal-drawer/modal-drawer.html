<!-- Modal Drawer - Slide-in modal from right -->
<div class="modal modal--drawer" id="modal-drawer" aria-hidden="true" role="dialog" aria-labelledby="modal-drawer-title">
  <div class="modal__overlay" data-modal-close></div>
  <div class="modal__container modal__container--drawer">
    <button class="modal__close" data-modal-close aria-label="Close modal">
      <i class="ri-close-line" aria-hidden="true"></i>
    </button>

    <div class="modal__content">
      <h2 class="heading heading--h3" id="modal-drawer-title">Heading goes here</h2>
      <p class="text text--muted">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse varius enim in eros elementum tristique.</p>
    </div>
  </div>
</div>

<!-- Trigger button -->
<button class="btn-icon" data-modal-open="modal-drawer" aria-label="Open drawer modal">
  <i class="ri-flashlight-line" aria-hidden="true"></i>
</button>
