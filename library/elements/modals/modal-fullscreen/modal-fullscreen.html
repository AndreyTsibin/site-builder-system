<!-- Modal Fullscreen - Full screen modal -->
<div class="modal modal--fullscreen" id="modal-fullscreen" aria-hidden="true" role="dialog" aria-labelledby="modal-fullscreen-title">
  <div class="modal__container modal__container--fullscreen">
    <button class="modal__close" data-modal-close aria-label="Close modal">
      <i class="ri-close-line" aria-hidden="true"></i>
    </button>

    <div class="modal__content">
      <h2 class="heading heading--h3" id="modal-fullscreen-title">Heading goes here</h2>
      <p class="text text--muted">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse varius enim in eros elementum tristique.</p>
    </div>
  </div>
</div>

<!-- Trigger button -->
<button class="btn-icon" data-modal-open="modal-fullscreen" aria-label="Open fullscreen modal">
  <i class="ri-flashlight-line" aria-hidden="true"></i>
</button>
