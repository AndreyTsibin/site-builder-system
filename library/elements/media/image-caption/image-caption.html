<!-- Image with Caption Below -->
<figure class="image-caption image-caption--below">
  <img
    src="https://placehold.co/600x400/667eea/ffffff?text=Caption+Below"
    alt="Image with caption below"
    class="image-caption__img"
    loading="lazy"
  />
  <figcaption class="image-caption__text">
    Beautiful landscape captured at sunset
  </figcaption>
</figure>

<!-- Image with Caption Overlay (Bottom) -->
<figure class="image-caption image-caption--overlay-bottom">
  <img
    src="https://placehold.co/600x400/f093fb/ffffff?text=Overlay+Bottom"
    alt="Image with overlay caption"
    class="image-caption__img"
    loading="lazy"
  />
  <figcaption class="image-caption__text">
    Caption over image with gradient
  </figcaption>
</figure>

<!-- Image with Caption and Credits -->
<figure class="image-caption image-caption--with-credits">
  <img
    src="https://placehold.co/600x400/4facfe/ffffff?text=With+Credits"
    alt="Image with credits"
    class="image-caption__img"
    loading="lazy"
  />
  <figcaption class="image-caption__text">
    <div class="image-caption__title">Modern Architecture</div>
    <div class="image-caption__credit">Photo by John Doe</div>
  </figcaption>
</figure>
